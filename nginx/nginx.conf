events {
    worker_connections 1024;
}

http {
    upstream webhook_api {
        server webhook_api:8000;
    }

    server {
        listen 80;

        # Rota principal usada pelo Stripe Dashboard (URL configurada no Webhook Destination)
        location /webhook {
            proxy_pass http://webhook_api/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rota alternativa (alias para compatibilidade)
        location /api/webhooks/stripe {
            proxy_pass http://webhook_api/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            return 200 'OK';
        }
    }
}
